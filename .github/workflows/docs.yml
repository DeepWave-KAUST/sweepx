name: Deploy sweepx docs to Pages

on:
  push:
    branches: [main]

  # The packages' docs are cloned at BUILD time, so a docs change pushed to
  # the sweep solver repo only reaches this site when the site rebuilds. This
  # daily run picks those up on its own.
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC — off the hour, which GitHub prefers

  # …and to publish a package's docs change immediately, run it by hand:
  #   gh workflow run docs.yml -R DeepWave-KAUST/sweepx
  # (or Actions → Deploy sweepx docs to Pages → Run workflow)
  workflow_dispatch:

# For push-triggered rebuilds instead, a package repo can notify this one via
# repository_dispatch — it needs a PAT with actions:write on sweepx, so the
# daily run above is the no-secret default:
#   curl -X POST -H "Authorization: Bearer $PAT" \
#     https://api.github.com/repos/DeepWave-KAUST/sweepx/dispatches \
#     -d '{"event_type":"docs-changed"}'
# repository_dispatch: { types: [docs-changed] }

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Install the geophysics stack (for mkdocstrings API rendering)
        run: |
          # CPU torch — sweep's equation modules import torch at module top,
          # so mkdocstrings' force_inspection needs it present.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # The toolkit from this checkout (its docs live in docs/ here), then
          # the solver from sweep@dev: mkdocs.yml imports the Solver docs from dev,
          # so an API page can document a class that is not in the released wheel
          # yet (ElasticTTI2nd / ElasticTTISG3D aborted the build that way).
          # --force-reinstall because dev carries the PyPI version string,
          # --no-deps because dev adds no runtime dependency of its own.
          pip install -e .
          pip install --force-reinstall --no-deps \
            "sweep-solver @ git+https://github.com/DeepWave-KAUST/sweep@dev"
          python - <<'PY'
          import importlib, sys
          from importlib.metadata import version
          print("sweep-solver", version("sweep-solver"), "| sweepx", version("sweepx"))
          print("sweep imported from", importlib.import_module("sweep").__file__)
          for mod in ("sweep", "sweep.parallel", "sweepx.agent",
                      "sweepx.tasks.runner", "sweepx.tasks.yaml_io", "sweepx.tasks.schemas",
                      "sweepx.nn", "sweepx.nn.diffusion.prior",
                      "sweepx.io.seismic_plan", "sweepx.io.cuda_prefetch"):
              try:
                  importlib.import_module(mod)
              except Exception as exc:
                  sys.exit(f"::error::{mod} is not importable ({exc}) — the docs "
                           f"reference it, so a resolver downgrade would fail later "
                           f"with an unreadable mkdocstrings error")
          PY

      - name: Build site (multirepo pulls the Solver docs)
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
