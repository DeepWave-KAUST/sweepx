name: Deploy sweepx docs to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rebuild when a sub-repo's docs change (optional; enable in each sub-repo):
#   curl -X POST -H "Authorization: Bearer $PAT" \
#     https://api.github.com/repos/DeepWave-KAUST/sweepx/dispatches \
#     -d '{"event_type":"docs-changed"}'
# repository_dispatch: { types: [docs-changed] }

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Install the geophysics stack (for mkdocstrings API rendering)
        run: |
          # CPU torch — sweep's equation modules import torch at module top,
          # so mkdocstrings' force_inspection needs it present.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Published packages (import as `sweep` / `sweep_agent`):
          pip install sweep-solver sweep-agent
          # NOTE: sweep-tasks is still a PRIVATE repo, so neither pip nor
          # multirepo can reach it from CI. Its Tasks tab is commented out in
          # mkdocs.yml — re-enable both (here and there) once sweep-tasks is
          # public or on PyPI. Until then:
          #   pip install sweep-tasks          # when on PyPI, or
          #   pip install "git+https://x-access-token:${GH_TOKEN}@github.com/DeepWave-KAUST/sweep-tasks@main"

      - name: Build site (multirepo pulls the package docs)
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
