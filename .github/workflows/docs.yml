name: Deploy sweepx docs to Pages

on:
  push:
    branches: [main]

  # The packages' docs are cloned at BUILD time, so a docs change pushed to
  # sweep / sweep-agent / … only reaches this site when the site rebuilds. This
  # daily run picks those up on its own.
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC — off the hour, which GitHub prefers

  # …and to publish a package's docs change immediately, run it by hand:
  #   gh workflow run docs.yml -R DeepWave-KAUST/sweepx
  # (or Actions → Deploy sweepx docs to Pages → Run workflow)
  workflow_dispatch:

# For push-triggered rebuilds instead, a package repo can notify this one via
# repository_dispatch — it needs a PAT with actions:write on sweepx, so the
# daily run above is the no-secret default:
#   curl -X POST -H "Authorization: Bearer $PAT" \
#     https://api.github.com/repos/DeepWave-KAUST/sweepx/dispatches \
#     -d '{"event_type":"docs-changed"}'
# repository_dispatch: { types: [docs-changed] }

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Install the geophysics stack (for mkdocstrings API rendering)
        run: |
          # CPU torch — sweep's equation modules import torch at module top,
          # so mkdocstrings' force_inspection needs it present.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Published packages (import as `sweep` / `sweep_agent` / `sweep_tasks`;
          # sweep-tasks brings sweep-loss, sweep-io and sweep-nn):
          pip install sweep-solver sweep-agent sweep-tasks
          # mkdocs.yml imports the Solver docs from sweep@dev, so an API page can
          # document a class that is not in the released wheel yet — ElasticTTI2nd
          # and ElasticTTISG3D did exactly that and aborted the build. Render the
          # API against the same ref the docs come from. Installed AFTER
          # sweep-agent so its resolver cannot pull the released wheel back over
          # it, --force-reinstall because dev carries the same version string as
          # PyPI, --no-deps because dev adds no runtime dependency of its own.
          pip install --force-reinstall --no-deps \
            "sweep-solver @ git+https://github.com/DeepWave-KAUST/sweep@dev"
          # A companion's upper pin can also silently hold sweep-solver back —
          # that is how v0.2.0 shipped with the umbrella still resolving 0.1.0,
          # and the only symptom was mkdocstrings failing to collect a class that
          # the API page documents. Say so here instead.
          # The Tasks tab imports its docs from sweep-tasks@main, so render its
          # API from main too — same --force-reinstall --no-deps as the solver.
          pip install --force-reinstall --no-deps \
            "sweep-tasks @ git+https://github.com/DeepWave-KAUST/sweep-tasks@main"
          # Same for the NN tab: its notebooks and API page come from sweep-nn@main.
          pip install --force-reinstall --no-deps \
            "sweep-nn @ git+https://github.com/DeepWave-KAUST/sweep-nn@main"
          python - <<'PY'
          import importlib, sys
          from importlib.metadata import version
          print("sweep-solver", version("sweep-solver"), "| sweep-agent", version("sweep-agent"),
                "| sweep-tasks", version("sweep-tasks"))
          print("sweep imported from", importlib.import_module("sweep").__file__)
          for mod in ("sweep", "sweep.parallel", "sweep_agent",
                      "sweep_tasks.runner", "sweep_tasks.yaml_io", "sweep_tasks.schemas",
                      "sweep_nn", "sweep_nn.diffusion.prior"):
              try:
                  importlib.import_module(mod)
              except Exception as exc:
                  sys.exit(f"::error::{mod} is not importable ({exc}) — the docs "
                           f"reference it, so a resolver downgrade would fail later "
                           f"with an unreadable mkdocstrings error")
          PY

      - name: Build site (multirepo pulls the package docs)
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
