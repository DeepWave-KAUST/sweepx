name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layers:
    # The layering contract: agent -> tasks -> io | loss | nn | opt, libraries free
    # of the engine. Static, so it needs no torch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --no-deps -e . && pip install "import-linter>=2.0"
      - run: lint-imports

  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # tests/tasks is most of the suite's time, so it runs as three shards
        # of about equal length; a new tasks test file lands in tasks-rest.
        include:
          - {name: io, args: tests/io}
          - {name: loss, args: tests/loss}
          - {name: nn, args: tests/nn}
          - {name: opt, args: tests/opt}
          - {name: agent, args: tests/agent}
          - {name: skill, args: tests/test_skill_snippets.py}   # every code block of skills/sweepx
          - name: tasks-plan
            args: >-
              tests/tasks/test_plan_streaming_rank_sync.py
              tests/tasks/test_task_fwi_plan_streaming.py
              tests/tasks/test_plan_streaming_dd_guards.py
              tests/tasks/test_plan_streaming_shared_shots.py
              tests/tasks/test_plan_streaming_schema_guards.py
              tests/tasks/test_plan_materialize.py
          - name: tasks-runner
            args: >-
              tests/tasks/test_task_runner_smoke.py
              tests/tasks/test_stage_resume.py
              tests/tasks/test_stage_scheduler.py
              tests/tasks/test_growing_hash_lr.py
          - name: tasks-rest
            args: >-
              tests/tasks
              --ignore=tests/tasks/test_plan_streaming_rank_sync.py
              --ignore=tests/tasks/test_task_fwi_plan_streaming.py
              --ignore=tests/tasks/test_plan_streaming_dd_guards.py
              --ignore=tests/tasks/test_plan_streaming_shared_shots.py
              --ignore=tests/tasks/test_plan_streaming_schema_guards.py
              --ignore=tests/tasks/test_plan_materialize.py
              --ignore=tests/tasks/test_task_runner_smoke.py
              --ignore=tests/tasks/test_stage_resume.py
              --ignore=tests/tasks/test_stage_scheduler.py
              --ignore=tests/tasks/test_growing_hash_lr.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU torch
        # sweep-solver leaves torch unpinned; the CPU wheel keeps pip from
        # pulling the multi-GB CUDA build.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[test]"
      - name: pytest ${{ matrix.name }}
        env:
          OMP_NUM_THREADS: "2"
        run: pytest ${{ matrix.args }} -rfE
