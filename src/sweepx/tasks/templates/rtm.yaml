# sweep-tasks RTM task YAML — COMPLETE annotated reference.
#
# Generate with:    sweep-tasks init rtm -o my_rtm.yaml
# Run with:         sweep-tasks run my_rtm.yaml
# Multi-GPU:        sweep-tasks run my_rtm.yaml --nproc-per-node 4
#
# RTM = reverse-time migration (one-pass imaging). Per shot: forward-model
# with the wavelet through vp, backpropagate bandpass-filtered obs, apply the
# imaging condition (cross-correlation ± illumination). Stack = the RTM image.
#
# ┌─ HOW TO READ THIS FILE ────────────────────────────────────────────────┐
# │ • UNCOMMENTED = active example (Viking RTM: 3 km offset, 3–25 Hz,       │
# │   illumination-normalized, depth-tapered post-filter).                  │
# │ • `#`-COMMENTED blocks = ALTERNATIVE modes / OPTIONAL features.         │
# │ • Schema is `extra="forbid"` — a mistyped key fails loudly at load.     │
# └────────────────────────────────────────────────────────────────────────┘

# ═══ Identity ════════════════════════════════════════════════════════════════

task_type: rtm
output_dir: ${VIKING_HOME}/run/viking_rtm
task_id: viking_rtm_v1
seed: 0
device: auto

# ═══ Grid + time axis (match the FWI grid that made velocity_model) ═══════════

grid:
  dh: 12.5
  # shape inferred from velocity_model.path npy header when omitted.
  # shape: [401, 2305]

time:
  dt: 0.001
  nt: 6000                          # 6.0 s — cover the deepest reflectors

# ═══ Source wavelet ═══════════════════════════════════════════════════════════
# Discriminated on `kind`: ricker | from_npy | siren_pipeline_npz

wavelet:
  kind: siren_pipeline_npz          # same wavelet as FWI is standard
  path: ${VIKING_HOME}/run/wavelet/siren_pipeline/estimated_wavelet.npz
  scale: 1.0
# ── ALTERNATIVES ──
# wavelet: {kind: ricker, fm: 8.0, delay: 0.125, scale: 1.0}
# wavelet: {kind: from_npy, path: /path/w.npy, scale: 1.0}

# ═══ Acquisition geometry + observed data ════════════════════════════════════
# RTM usually uses a NARROWER-offset plan than FWI (far offsets pollute the
# image). geometry.kind: line | explicit | from_file | from_segy_headers |
#                        from_segy_index | from_plan

geometry:
  kind: from_plan
  plan_path: ${VIKING_HOME}/run/viking_csg_3km.npz
  dedupe: true
  dedup_method: nearest             # "nearest" | "first"
# ── ALTERNATIVES: same six kinds as FWI (see fwi.yaml) ──
# geometry: {kind: from_segy_index, index_path: /p/index.npz}

# Observed data — pick EXACTLY ONE source; must match `geometry`.
obs:
  plan:
    plan_path: ${VIKING_HOME}/run/viking_csg_3km.npz
    cache_all: true                 # 2-D fits RAM; false = per-iter read (3-D)
    # n_receivers_per_shot: null    # cap receivers/shot
    # receiver_select: nearest      # "nearest" | "random" | "all"
# ── ALTERNATIVES ──
# obs: {npy_path: /path/obs.npy}
# obs: {segy: {path: /path/obs.segy, byte_map: {sx: 73, gx: 81}}}
# obs: {segy_index: {index_path: /path/index.npz, lazy: true}}

# ═══ Wave-equation physics ════════════════════════════════════════════════════

physics:
  equation: Acoustic
  spatial_order: 6
  abcn: 20
  free_surface: true
  source_type: ["h1"]
  receiver_type: ["h1"]

# ═══ Compute backend ══════════════════════════════════════════════════════════
# impl: eager (portable, slow) | c (CUDA kernels, production)

backend:
  impl: c
  use_ckpt: false
  cuda_options:
    memory:
      strategy: boundary            # null(store-all) | boundary | ckpt
      boundary:
        storage: gpu                # "gpu" | "cpu" | "disk"
        storage_dtype: fp32         # "fp32" | "fp16" | "bf16" | "int8"
    # memory: {strategy: ckpt, ckpt: {mode: chunk, chunks: 100, storage: gpu}}

# ═══ Velocity model to image with ════════════════════════════════════════════
# The final FWI vp (or any trusted vp). Imaging the INITIAL vp instead gives
# a useful baseline-vs-inverted QC pair.

velocity_model:
  name: vp
  path: ${VIKING_HOME}/run/viking_fwi/viking_fwi_6stage_v1/output/inverted_vp.npy

# ═══ Loss / imaging-condition gradient form ══════════════════════════════════
# kind: mse | l1 | huber | trace_cosine  (mse = classical cross-correlation)

loss:
  kind: mse
  # trace_cosine_demean: true       # only for kind: trace_cosine

# ═══ Velocity bounds (clip vp; does NOT touch the image) ═════════════════════
# Optional for RTM (null = unbounded).

model_bounds:
  vp:
    min: 1450.0
    max: 5500.0

# ═══ Per-shot local-window (recommended for long streamer lines) ═════════════

local_model_window:
  enabled: true
  padding_x_m: 1500.0
  padding_z_m: 0.0
  full_depth: true
  min_width_m: 0.0

# ═══ Imaging condition + filters ═════════════════════════════════════════════

imaging:
  shots_per_batch: 1                # shots forward-modeled per minibatch
  # ---- bandpass: sets the image frequency band ----
  filter_lowcut_hz: 3.0
  filter_highcut_hz: 25.0
  filter_order: 4
  filter_padtype: odd               # "odd" | "even" | "constant" | "none"
  filter_target: syn                # "syn" (filter obs+syn) | "wavelet" (~2× faster)
  # ---- illumination normalization ----
  illumination_epsilon: 1.0e-6      # Tikhonov stabilizer for the 1/illum divide
  normalize_by_illumination: true   # makes the deep section visible (marine)
  # ---- outputs ----
  save_per_shot: false
  live_update_every_batches: 10     # stacked-image PNG cadence
  loss_kind: mse                    # "mse" | "l1" | "trace_cosine"
  trace_cosine_demean: true         # only for loss_kind: trace_cosine
  # ---- depth-tapered z-axis low-cut post-filter (strips slow drift) ----
  # Also available standalone: `sweep-tasks filter-image <image>.npy`
  post_filter:
    enabled: true
    wavelength_m: 300.0             # z-wavelength threshold for "slow drift"
    depth_m: 600.0                  # full-strength in 0..depth_m
    taper_m: 400.0                  # cosine ramp to zero over depth_m..+taper_m
    clip_percentile: 1.0            # PNG vmin/vmax = ±percentile
    display_scale: 1.0
    cmap: sweep_image               # or "seismic" / "gray"
    targets: all                    # "all" | list of product names
    save_png: true
    # every_n_epochs: 10

# ═══ Pre-RTM data selection (optional) ═══════════════════════════════════════
# data_plan:
#   shot_start: 0
#   shot_stop: null
#   shot_stride: 1                  # e.g. 4 = every 4th shot (quick preview)
#   receiver_stride: 1
#   offset_min_m: null
#   offset_max_m: 3000.0            # extra offset cap on top of the plan
#   t_start_s: null
#   t_end_s: null

# ═══ QC artifacts (optional) ═════════════════════════════════════════════════
# qc:
#   every_n_epochs: 10
#   vp_png: true                    # the velocity model used
#   shot_gather: false
#   shot_gather_normalize: trace    # "trace" | "shot" | "joint"
#   loss_curve: false
