# sweep-tasks LSRTM task YAML — COMPLETE annotated reference.
#
# Generate with:    sweep-tasks init lsrtm -o my_lsrtm.yaml
# Run with:         sweep-tasks run my_lsrtm.yaml
# Multi-GPU:        sweep-tasks run my_lsrtm.yaml --nproc-per-node 4
#
# LSRTM = least-squares reverse-time migration. Inverts for a REFLECTIVITY
# image that, when Born-modeled through the smooth `background_model`,
# best matches data generated from `true_model`. Two solvers run internally:
# AcousticLSRTM (foreground/perturbation) + Acoustic (background).
#
# ┌─ HOW TO READ THIS FILE ────────────────────────────────────────────────┐
# │ • UNCOMMENTED = active example (Marmousi 2-D synthetic LSRTM).          │
# │ • `#`-COMMENTED blocks = ALTERNATIVE modes / OPTIONAL features.         │
# │ • Schema is `extra="forbid"` — a mistyped key fails loudly at load.     │
# │ • LSRTM has NO obs block (data comes from true_model), NO reparam,      │
# │   NO source_encoding — those are FWI-only.                              │
# └────────────────────────────────────────────────────────────────────────┘

# ═══ Identity ════════════════════════════════════════════════════════════════

task_type: lsrtm
output_dir: ./sweep_runs
task_id: marmousi_lsrtm
seed: 0
device: auto

# ═══ Grid + time axis ═════════════════════════════════════════════════════════

grid:
  dh: 12.5
  # shape inferred from background_model.path npy header when omitted.
  # shape: [281, 1361]

time:
  dt: 0.001
  nt: 4000                          # 4.0 s

# ═══ Source wavelet ═══════════════════════════════════════════════════════════
# Discriminated on `kind`: ricker | from_npy | siren_pipeline_npz

wavelet:
  kind: ricker
  fm: 15.0                          # peak frequency [Hz]  (required)
  delay: 0.1
  scale: 1.0
# ── ALTERNATIVES ──
# wavelet: {kind: from_npy, path: /path/w.npy, scale: 1.0}
# wavelet: {kind: siren_pipeline_npz, path: /path/estimated_wavelet.npz}

# ═══ Acquisition geometry ═════════════════════════════════════════════════════
# Discriminated on `kind`: line | explicit | from_file | from_segy_headers |
#                          from_segy_index | from_plan

geometry:
  kind: line
  sources:   {step: 20, depth: 1}
  receivers: {step: 1,  depth: 1}
# ── ALTERNATIVES: same six kinds as FWI (see fwi.yaml) ──
# geometry: {kind: from_plan, plan_path: /p/plan.npz, dedupe: true, dedup_method: nearest}  # nearest|first

# ═══ Wave-equation physics ════════════════════════════════════════════════════

physics:
  equation: AcousticLSRTM            # LSRTM foreground solver (NOT plain Acoustic);
                                     # the runner derives the Acoustic background from it
  spatial_order: 8
  abcn: 20
  free_surface: false
  pml_type: cpmlr
  source_type: [h1]
  receiver_type: [sh1]               # LSRTM records the scattered field

# ═══ Compute backend ══════════════════════════════════════════════════════════
# impl: eager (portable, slow) | c (CUDA kernels, production)

backend:
  impl: eager
  use_ckpt: false
  # ---- production CUDA + boundary saving ----
  # impl: c
  # cuda_options:
  #   memory:
  #     strategy: boundary           # null(store-all) | boundary | ckpt
  #     boundary: {storage: gpu, storage_dtype: fp32}   # storage gpu|cpu|disk; dtype fp32|fp16|bf16|int8
  #     # OR: memory: {strategy: ckpt, ckpt: {mode: chunk, chunks: 100}}   # mode: chunk|recursive

# ═══ Models — smooth background + true (data source) ═════════════════════════
# background_model: the smooth migration velocity (Born reference).
# true_model:       generates the "observed" data whose reflectivity we invert.
# Each is a single ModelRef (name + path, OR constant + shape).

background_model:
  name: vp
  path: ./vp_smooth.npy
true_model:
  name: vp
  path: ./vp_true.npy

# ═══ Optimizer ════════════════════════════════════════════════════════════════
# Discriminated on `kind`: adam | sgd | lbfgs

optimizer:
  kind: adam
  lr: 0.05                          # reflectivity is ~O(1); much smaller LR than FWI vp
  # eps: 1.0e-16
# ── ALTERNATIVES ──
# optimizer: {kind: sgd, lr: 0.02, momentum: 0.9}
# optimizer: {kind: lbfgs, lr: 1.0, max_iter: 20, line_search_fn: strong_wolfe}

# ═══ LR scheduler ═════════════════════════════════════════════════════════════
# Discriminated on `kind`: constant | step | exp | cosine

scheduler:
  kind: constant
# scheduler: {kind: cosine, t_max: 50, eta_min: 0.0}

# ═══ Loss / misfit ════════════════════════════════════════════════════════════
# kind: mse | l1 | huber | trace_cosine

loss:
  kind: mse

# ═══ Iteration budget ═════════════════════════════════════════════════════════

epochs: 50
batchsize: 8                        # shots per iter
train_shot_batchsize: 1             # gradient micro-batch per forward solve
show_every: 10

# ═══ Reflectivity bounds (optional clip on the image) ════════════════════════
# reflectivity_bounds: {enabled: true, min: -1.0, max: 1.0}

# ═══ Shallow handling (optional) ═════════════════════════════════════════════

freeze_top_n_rows: 0                # zero the reflectivity update in the top N rows

# ═══ Multiscale stages (optional; low → high frequency) ══════════════════════
# Same per-stage keys as FWI: epochs, batch_size, dh_m, dt_s, nt, lr_scale,
# optimizer_reset, wavelet, bandpass (lo_hz/hi_hz/order/padtype odd|even|constant/target syn|wavelet).
# stages:
#   - {epochs: 25, batch_size: 8, bandpass: {lo_hz: 3.0, hi_hz: 10.0, order: 4, target: syn}}
#   - {epochs: 25, batch_size: 8, bandpass: {lo_hz: 3.0, hi_hz: 25.0, order: 4, target: syn}}

# ═══ Obs-synthesis override + resume (optional) ══════════════════════════════
# modeling_override:                # different wavelet/geometry for data gen
#   wavelet: {kind: ricker, fm: 12.0}
# save_illumination: false
# resume: false                     # auto-resume from checkpoint.pt here
# resume_from: <task_id>            # resume from a different run
