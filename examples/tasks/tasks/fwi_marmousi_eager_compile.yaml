# FWI on Marmousi with the eager (pure-PyTorch) backend, with torch.compile
# enabled. Mirrors examples/_shared/configure_marmousi.py:fwi_2d_acoustic_torch_eager,
# which currently uses use_compile=True for production runs.
task_type: fwi
output_dir: ./sweep_tasks
device: auto
seed: 0

grid:    { dh: 25.0 }
time:    { dt: 0.002, nt: 2500 }
wavelet: { kind: ricker, fm: 5.0, delay: 0.256, scale: 1.0 }

geometry:
  kind: line
  sources:   { step: 2, depth: 1 }
  receivers: { step: 1, depth: 18 }

physics:
  equation: Acoustic
  spatial_order: 8
  abcn: 20
  free_surface: false
  pml_type: cpmlr
  source_type: [h1]
  receiver_type: [h1]

backend:
  impl: eager
  eager_options:
    use_compile: true
    compile_mode: default        # default | reduce-overhead | max-autotune
    compile_dynamic: false
    compile_fullgraph: false
  use_ckpt: false

init_model: { name: vp, path: ../models/marmousi/smooth.npy }
obs:
  synthetic_from: { name: vp, path: ../models/marmousi/true.npy }

optimizer: { kind: adam, lr: 25.0, eps: 1.0e-22 }
epochs: 101
batchsize: 8
show_every: 10
