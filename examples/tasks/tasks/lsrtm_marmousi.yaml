# Mirrors examples/LSRTM/2d/acoustic/torch/lsrtm.py defaults
# (fm=10.0, lr_ref=0.01). Paths resolve relative to this YAML.
task_type: lsrtm
output_dir: ./sweep_runs
device: auto
seed: 0

grid:
  dh: 25.0
time:
  dt: 0.002
  nt: 2500
wavelet:
  kind: ricker
  fm: 10.0
  delay: 0.256
  scale: 1.0

geometry:
  kind: line
  sources:
    step: 2
    depth: 1
  receivers:
    step: 1
    depth: 18

physics:
  equation: AcousticLSRTM
  spatial_order: 8
  abcn: 20
  free_surface: false
  pml_type: cpmlr
  source_type: [h1]
  receiver_type: [sh1]

backend:
  impl: eager
  use_ckpt: false

background_model:
  name: vp
  path: ../models/marmousi/smooth.npy
true_model:
  name: vp
  path: ../models/marmousi/true.npy

optimizer:
  kind: adam
  lr: 0.01
  eps: 1.0e-22

epochs: 101
batchsize: 8
show_every: 10
