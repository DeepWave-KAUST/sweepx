# Forward modelling with hand-picked source/receiver positions.
# Same constant-vp setup as forward_acoustic_constant.yaml, but with
# `geometry.kind: explicit` so the source and receiver coordinates are
# literal lists rather than auto-generated by a stride.
task_type: forward
output_dir: ./sweep_tasks
device: auto
seed: 0

grid:    { dh: 5.0 }
time:    { dt: 0.001, nt: 500 }
wavelet: { kind: ricker, fm: 18.0, delay: 0.12, scale: 1.0e6 }

geometry:
  kind: explicit
  # 3 shots near the top of the model, irregularly spaced
  sources:
    - [40, 4]
    - [90, 4]
    - [160, 4]
  # receivers shared across all three shots (broadcast form)
  receivers:
    - [10, 8]
    - [30, 8]
    - [60, 8]
    - [90, 8]
    - [120, 8]
    - [150, 8]
    - [170, 8]

physics:
  equation: Acoustic
  spatial_order: 8
  abcn: 20
  free_surface: false
  pml_type: cpmlr
  source_type: [h1]
  receiver_type: [h1]

backend: { impl: eager, use_ckpt: false }

models:
  - { name: vp, constant: 2200.0, shape: [120, 180] }
