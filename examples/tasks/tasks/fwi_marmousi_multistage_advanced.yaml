# Showcase YAML combining the Phase-1 patch features:
#   * multi-stage frequency continuation (3 Hz -> 5 Hz -> 8 Hz)
#   * Huber loss (robust against outliers)
#   * model bounds on vp (clamp to [1500, 5500] m/s every step)
#   * freeze top water-layer rows (top 4 rows have grad zeroed)
#   * cosine learning-rate schedule across the whole run
#   * gradient accumulation via train_shot_batchsize
#   * source illumination saved as artifact
#
# Each stage uses its own Ricker wavelet. The lr_scale at the start of each
# stage multiplies the optimiser's base lr (so later stages take smaller steps).
task_type: fwi
output_dir: ./sweep_tasks
device: auto
seed: 0

grid:    { dh: 25.0 }
time:    { dt: 0.002, nt: 2500 }

# Top-level wavelet is used by any stage that does NOT override it.
wavelet: { kind: ricker, fm: 5.0, delay: 0.256, scale: 1.0 }

geometry:
  kind: line
  sources:   { step: 2, depth: 1 }
  receivers: { step: 1, depth: 18 }

physics:
  equation: Acoustic
  spatial_order: 8
  abcn: 20
  free_surface: false
  pml_type: cpmlr
  source_type: [h1]
  receiver_type: [h1]

backend:
  impl: eager
  eager_options: { use_compile: true }

init_model: { name: vp, path: ../models/marmousi/smooth.npy }
obs:
  synthetic_from: { name: vp, path: ../models/marmousi/true.npy }

# A robust loss is helpful when obs contains outliers or amplitude mismatch.
loss: { kind: huber, huber_delta: 0.05 }

optimizer:
  kind: adam
  lr: 25.0
  eps: 1.0e-22

# Decay the lr smoothly to 1.0 over the full run.
scheduler:
  kind: cosine
  eta_min: 1.0

# Three-stage frequency continuation, total 75 epochs.
stages:
  - epochs: 25
    wavelet: { kind: ricker, fm: 3.0, delay: 0.4, scale: 1.0 }
    lr_scale: 1.0
  - epochs: 25
    wavelet: { kind: ricker, fm: 5.0, delay: 0.256, scale: 1.0 }
    lr_scale: 0.6
  - epochs: 25
    wavelet: { kind: ricker, fm: 8.0, delay: 0.16, scale: 1.0 }
    lr_scale: 0.3

# epochs is required by the schema but ignored when stages is set.
epochs: 75

batchsize: 8
train_shot_batchsize: 4       # accumulate gradient over 2 chunks of 4 shots
show_every: 5

# Clamp vp to plausible Marmousi range after every optimiser step.
model_bounds:
  vp: { min: 1500.0, max: 5500.0 }

# Freeze the topmost 4 rows of the grid (e.g. a thin water layer).
freeze_top_n_rows: 4

# Save source / receiver illumination maps every show_every epochs.
save_illumination: true
