# FWI on Marmousi with the compiled CUDA binding, boundary saving offloaded
# to pinned CPU memory. Use this when GPU memory is tight (3D models,
# long recording, deep checkpoint depth). The transfer_interval batches
# boundary transfers to amortise PCIe latency.
task_type: fwi
output_dir: ./sweep_runs
device: auto
seed: 0

grid:    { dh: 25.0 }
time:    { dt: 0.002, nt: 2500 }
wavelet: { kind: ricker, fm: 5.0, delay: 0.256, scale: 1.0 }

geometry:
  kind: line
  sources:   { step: 2, depth: 1 }
  receivers: { step: 1, depth: 18 }

physics:
  equation: Acoustic
  spatial_order: 8
  abcn: 20
  free_surface: false
  pml_type: cpmlr
  source_type: [h1]
  receiver_type: [h1]

backend:
  impl: c
  cuda_options:
    memory:
      strategy: boundary
      boundary:
        storage: cpu
        transfer_interval: 10    # send 10 time-step boundaries per host copy
        pinned_memory: true      # use page-locked memory for faster DMA

init_model: { name: vp, path: ../models/marmousi/smooth.npy }
obs:
  synthetic_from: { name: vp, path: ../models/marmousi/true.npy }

optimizer: { kind: adam, lr: 25.0, eps: 1.0e-22 }
epochs: 101
batchsize: 8
show_every: 10
