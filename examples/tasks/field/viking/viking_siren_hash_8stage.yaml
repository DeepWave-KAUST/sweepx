# Viking 2-D streamer FWI — SIREN + multi-resolution hash encoding
# Translation of legacy fwi_workflow-dev/configs/datasets/viking.yaml `fwi:` block.
# Drive via sweep-tasks CLI; 8-stage frequency continuation (2-5 → 2-40 Hz).
#
# Designed for 8x V100 ibex node; launch with
#   torchrun --nproc_per_node=8 -m sweep_tasks run <this.yaml>

task_type: fwi
output_dir: ${SWEEP_RUNS_ROOT}/viking_sweep
task_id: viking_siren_hash_v1
seed: 2026
device: auto

grid:
  dh: 12.5
  shape: [401, 2305]   # (nz, nx) = legacy model.nz / nx
time:
  dt: 0.001
  nt: 6000             # legacy tmax=6.0 s @ dt=0.001 → 6000 samples (top of stage ladder)

wavelet:
  kind: siren_pipeline_npz
  path: ${SWEEP_REPOS_ROOT}/fwi_workflow-dev/data/viking/wavelets/siren_pipeline/estimated_wavelet.npz
  scale: 1.0

geometry:
  kind: from_segy_headers
  path: ${PROJECT_DATA_ROOT}/results/field_data/viking/raw/seismic.segy
  source_depth_m_override: 6.0
  receiver_depth_m_override: 10.0
  dedupe: true

physics:
  equation: Acoustic
  spatial_order: 6
  abcn: 20
  free_surface: true
  pml_type: cpmlr
  source_type: ["h1"]
  receiver_type: ["h1"]

backend:
  impl: c
  use_ckpt: false
  cuda_options:
    memory:
      strategy: boundary
      boundary:
        storage: gpu
        # transfer_interval / pinned_memory not valid for storage=gpu
        # (boundary buffers stay on GPU; no host transfer to schedule).
        # Switch to storage=cpu if 8x V100 32GB is too tight for the
        # wavefield + boundary snapshots at the deepest stage's nt.

init_model:
  name: vp
  path: ${SWEEP_REPOS_ROOT}/fwi_workflow-dev/data/viking/models/viking_initial_model_12.5m.npy

obs:
  segy:
    path: ${PROJECT_DATA_ROOT}/results/field_data/viking/raw/seismic.segy
    source_depth_m_override: 6.0
    receiver_depth_m_override: 10.0

optimizer:
  kind: adam
  lr: 25.0
  eps: 1.0e-16
scheduler:
  kind: constant

loss:
  kind: trace_cosine
  trace_cosine_demean: true

model_bounds:
  vp:
    min: 1450.0
    max: 5500.0

# SIREN + multi-resolution hash (matches legacy neural_network + hash_encoding)
reparam:
  kind: velocity_inr
  hidden_features: 128
  hidden_layers: 2
  first_omega0: 10.0
  hidden_omega0: 10.0
  use_bias: false
  vp_mean: 0.0
  vp_std: 400.0
  direct_velocity: false
  lr: 1.0e-4
  backward_mode: two_pass_full      # legacy inr_backward_mode=full
  hash:
    enabled: true
    levels: 16
    features_per_level: 1
    log2_size: 18
    base_resolution: 16
    finest_resolution: 512

# Per-batch local model windowing (matches legacy use_local_model_windows=true)
local_model_window:
  enabled: true
  padding_x_m: 1500.0
  padding_z_m: 0.0
  full_depth: true
  min_width_m: 0.0

# 8 stages × 50 iter, matching legacy viking.yaml fwi.stages.
epochs: 400
batchsize: 48
train_shot_batchsize: 1   # chunk solver to 1 shot at a time per rank — prevents GPU OOM
                          # at finer stages (matches legacy solver-inner-batch default).
show_every: 10

stages:
  - {epochs: 50, batch_size: 48,  dh_m: 75.0,   dt_s: 0.004,  nt: 1500, bandpass: {lo_hz: 2.0, hi_hz: 5.0,  order: 4, target: syn}}
  - {epochs: 50, batch_size: 64,  dh_m: 37.5,   dt_s: 0.002,  nt: 3000, bandpass: {lo_hz: 2.0, hi_hz: 10.0, order: 4, target: syn}}
  - {epochs: 50, batch_size: 80,  dh_m: 25.0,   dt_s: 0.0015, nt: 4000, bandpass: {lo_hz: 2.0, hi_hz: 15.0, order: 4, target: syn}}
  - {epochs: 50, batch_size: 96,  dh_m: 18.75,  dt_s: 0.001,  nt: 6000, bandpass: {lo_hz: 2.0, hi_hz: 20.0, order: 4, target: syn}}
  - {epochs: 50, batch_size: 112, dh_m: 15.0,   dt_s: 0.001,  nt: 6000, bandpass: {lo_hz: 2.0, hi_hz: 25.0, order: 4, target: syn}}
  - {epochs: 50, batch_size: 128, dh_m: 12.5,   dt_s: 0.001,  nt: 6000, bandpass: {lo_hz: 2.0, hi_hz: 30.0, order: 4, target: syn}}
  - {epochs: 50, batch_size: 144, dh_m: 12.5,   dt_s: 0.001,  nt: 6000, bandpass: {lo_hz: 2.0, hi_hz: 35.0, order: 4, target: syn}}
  - {epochs: 50, batch_size: 160, dh_m: 12.5,   dt_s: 0.001,  nt: 6000, bandpass: {lo_hz: 2.0, hi_hz: 40.0, order: 4, target: syn}}

qc:
  every_n_epochs: 10
  vp_png: true
  vp_diff_png: true
  gradient_png: false
  shot_gather: true
  shot_gather_n_shots: 2
  loss_curve: true
