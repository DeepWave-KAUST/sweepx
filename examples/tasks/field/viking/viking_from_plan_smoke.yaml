# Viking 2-D FWI smoke run — exercises the unified plan path:
#   geometry: from_plan + obs: { plan: ... }  → SeismicPlan + PlanReader
#
# The plan was built by:
#   sweep-tasks build-index --segy-root <dir> --glob seismic.segy --out viking_index.npz
#   sweep-tasks build-plan --index viking_index.npz --grouping csg --out viking_csg_plan.npz
#
# Single stage, 5 epoch, 1 V100 — smoke check that the plan-driven path
# produces sensible obs/syn and the loss decreases like the benchmark
# (just at a tiny scale).

task_type: fwi
output_dir: ${SWEEP_RUNS_ROOT}/viking_from_plan_smoke
task_id: viking_plan_v1
seed: 2026
device: auto

grid:
  dh: 12.5
  shape: [401, 2305]
time:
  dt: 0.001
  nt: 6000

wavelet:
  kind: siren_pipeline_npz
  path: ${SWEEP_REPOS_ROOT}/fwi_workflow-dev/data/viking/wavelets/siren_pipeline/estimated_wavelet.npz
  scale: 1.0

# >>> the NEW unified geometry: reads the SeismicPlan on disk <<<
geometry:
  kind: from_plan
  plan_path: ${SWEEP_RUNS_ROOT}/viking_unified/viking_csg_plan.npz
  dedupe: true

# >>> the NEW unified obs: same plan, lazy reader (cache_all=true for 2-D OK) <<<
obs:
  plan:
    plan_path: ${SWEEP_RUNS_ROOT}/viking_unified/viking_csg_plan.npz
    cache_all: true

physics:
  equation: Acoustic
  spatial_order: 6
  abcn: 20
  free_surface: true
  pml_type: cpmlr
  source_type: ["h1"]
  receiver_type: ["h1"]

backend:
  impl: c
  use_ckpt: false
  cuda_options:
    memory:
      strategy: boundary
      boundary:
        storage: gpu

init_model:
  name: vp
  path: ${SWEEP_REPOS_ROOT}/fwi_workflow-dev/data/viking/models/viking_initial_model_12.5m.npy

optimizer:
  kind: adam
  lr: 25.0
  eps: 1.0e-16
scheduler:
  kind: constant

loss:
  kind: trace_cosine
  trace_cosine_demean: true

model_bounds:
  vp:
    min: 1450.0
    max: 5500.0

reparam:
  kind: velocity_inr
  hidden_features: 128
  hidden_layers: 2
  first_omega0: 10.0
  hidden_omega0: 10.0
  use_bias: false
  vp_mean: 0.0
  vp_std: 400.0
  direct_velocity: false
  lr: 1.0e-4
  backward_mode: two_pass_full
  hash:
    enabled: true
    levels: 16
    features_per_level: 1
    log2_size: 18
    base_resolution: 16
    finest_resolution: 512

local_model_window:
  enabled: true
  padding_x_m: 1500.0
  padding_z_m: 0.0
  full_depth: true
  min_width_m: 0.0

epochs: 5
batchsize: 24
train_shot_batchsize: 1
show_every: 1

stages:
  - {epochs: 5, batch_size: 24, dh_m: 75.0, dt_s: 0.004, nt: 1500, bandpass: {lo_hz: 2.0, hi_hz: 10.0, order: 4, target: syn}}

qc:
  every_n_epochs: 1
  vp_png: true
  loss_curve: true
