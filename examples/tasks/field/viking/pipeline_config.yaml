# Viking 2-D — the pipeline config for Steps 1-2 of
# docs/tasks/datasets/viking/README.md: SEG-Y -> trace index -> CSG plan.
# It is not a task spec; `sweep-tasks build-index` and `build-plan` read it.
# (`sweep-tasks init viking` writes the same two sections, plus the
# wavelet-tool sections this example does not use.)
#
# Usage:
#   export VIKING_HOME=$HOME/viking
#   sweep-tasks build-index --config examples/tasks/field/viking/pipeline_config.yaml
#   sweep-tasks build-plan  --config examples/tasks/field/viking/pipeline_config.yaml
#
# Precedence (lowest → highest): argparse default → per-step section → CLI
# flag. Environment variables ($VAR / ${VAR}) in string values are expanded
# at load time.

build_index:
  segy_root:        ${VIKING_HOME}/raw
  glob:             'seismic.segy'
  out:              ${VIKING_HOME}/run/viking_index.npz
  num_workers:      8
  source_depth_m:   6.0
  receiver_depth_m: 10.0
  progress:         true

build_plan:
  index:    ${VIKING_HOME}/run/viking_index.npz
  grouping: csg
  out:      ${VIKING_HOME}/run/viking_csg_plan.npz
  label:    viking_full_csg
