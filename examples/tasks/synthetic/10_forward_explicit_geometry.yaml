# Hand-placed sources and receivers.
#
# Teaches:  `geometry.kind: explicit` — literal coordinate lists instead of the
#           stride rule `kind: line` generates. Use it when the acquisition is
#           irregular: a few scattered shots, a gap in the spread, one node in
#           an odd place.
# Needs:    nothing — same constant-vp box as 09, no dataset, no GPU.
# Produces: output/record.npy (3, 500, 7, 1) + sources.npy + receivers.npy.
#
# Run:
#   sweep-tasks run examples/synthetic/10_forward_explicit_geometry.yaml
#
# Read 09 first — it annotates every field below that is not about geometry.
# The only difference here is the `geometry:` block.
#
# The four geometry kinds, and when each earns its place:
#   `line`     stride rule, 2-D only. The default for regular surveys.
#   `grid`     stride rule on x AND y, 3-D only (see 13). Same idea, one axis up.
#   `explicit` these literal lists. Irregular layouts, and small ones — a
#              1000-channel spread would be 1000 YAML lines, which is what
#              `line` / `grid` exist to avoid.
#   `from_file` the same arrays as .npy, for when a script generated them.
# (`from_segy_headers` / `from_segy_index` / `from_plan` read real acquisition
# geometry out of field data; the field examples use those.)

task_type: forward
output_dir: ./sweep_runs
device: auto
seed: 0

grid:    { dh: 5.0 }
time:    { dt: 0.001, nt: 500 }
wavelet: { kind: ricker, fm: 18.0, delay: 0.12, scale: 1.0e6 }

geometry:
  kind: explicit
  # Coordinates are GRID INDICES, not metres, and in (x, z) order for a 2-D
  # grid — the same convention `line` produces. For a 3-D grid they are
  # (x, y, z), and the width has to match the model's ndim or the runner says so.
  #
  # 3 shots near the top, irregularly spaced — the thing `line` cannot express.
  sources:
    - [40, 4]
    - [90, 4]
    - [160, 4]
  # Receivers come in two forms. This is the SHARED form: one (nrec, ndim) list
  # that every shot reuses, which the runner broadcasts to (nshots, nrec, ndim)
  # internally. The per-shot form is a list of lists — one receiver table per
  # shot, first axis equal to the shot count — for surveys where the spread
  # moves with the source (a streamer, say).
  receivers:
    - [10, 8]
    - [30, 8]
    - [60, 8]
    - [90, 8]
    - [120, 8]
    - [150, 8]
    - [170, 8]

physics:
  equation: Acoustic
  spatial_order: 8
  abcn: 20
  free_surface: false
  source_type: [h1]
  receiver_type: [h1]

backend: { impl: eager, use_ckpt: false }

models:
  - { name: vp, constant: 2200.0, shape: [120, 180] }
