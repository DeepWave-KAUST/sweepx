[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweep-loss"
version = "0.1.0"
description = "A PyTorch library of misfit (loss) functions for Full Waveform Inversion (sweep plugin)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Shaowen Wang", email = "shaowen.wang@kaust.edu.sa"},
]
keywords = ["fwi", "geophysics", "loss", "misfit", "seismic", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=1.13",
    "numpy>=1.20",
]

[project.optional-dependencies]
# GSOTLoss needs scipy's Hungarian solver at *runtime*. Everything else is
# pure torch+numpy, so scipy is opt-in: `pip install sweep-loss[gsot]`.
gsot = ["scipy>=1.8"]
test = ["pytest>=7", "scipy>=1.8"]
dev  = ["pytest>=7", "scipy>=1.8", "ruff", "black"]


[project.urls]
Homepage = "https://github.com/DeepWave-KAUST/sweep-loss"
Issues   = "https://github.com/DeepWave-KAUST/sweep-loss/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream type-checkers use our annotations.
sweep_loss = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py38"
src = ["src", "tests"]

[tool.ruff.lint]
# F = pyflakes, I = isort, W/E = pycodestyle, B = bugbear.
# UP (pyupgrade) is intentionally NOT selected: this package targets py3.8
# and deliberately uses `from __future__ import annotations` + quoted /
# Optional annotations for clean 3.8 support, which UP would "modernise"
# into 3.10+ idioms.
select = ["F", "I", "W", "E", "B"]
# E501: math-heavy docstrings/reference tables overflow 100 cols.
# E741: single-letter names like O (obs spectrum) / l are conventional in
#       the FFT / linear-algebra code here.
ignore = ["E501", "E741"]
