site_name: fwiloss
site_description: "A PyTorch library of misfit (loss) functions for Full Waveform Inversion."
site_author: "Shijun Wang"
repo_url: "https://github.com/DeepWave-KAUST/sweep-loss"
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting_started/installation.md
      - Quick start: getting_started/quickstart.md
      - Data convention: getting_started/data_convention.md
  - Loss functions:
      - Overview: losses/index.md
      - L2 (least squares): losses/l2.md
      - L1 (absolute): losses/l1.md
      - Huber / pseudo-Huber: losses/huber.md
      - Hybrid L1/L2 (Bube–Langan): losses/hybrid_l1l2.md
      - Cauchy / Tukey / Geman–McClure: losses/robust.md
      - Student-t NLL: losses/student_t.md
      - Trace-normalised L2 / NCC: losses/correlation.md
      - Cross-correlation travel-time: losses/traveltime.md
      - Envelope (Bozdağ / Wu / Chi): losses/envelope.md
      - Instantaneous phase + Envelope+Phase: losses/inst_phase.md
      - Exponentiated phase (Yuan 2020): losses/exponentiated_phase.md
      - Frequency / Laplace domain: losses/frequency.md
      - Normalised Integration Method (NIM): losses/nim.md
      - Adaptive Waveform Inversion (AWI): losses/awi.md
      - Deconvolution (Luo–Sava): losses/deconvolution.md
      - 1-Wasserstein (Métivier 2016): losses/w1.md
      - 2-Wasserstein (Engquist–Froese / Yang): losses/w2.md
      - Sinkhorn / entropic OT: losses/sinkhorn.md
      - Graph-space OT (Métivier 2018): losses/gsot.md
      - Soft-DTW (Cuturi-Blondel 2017): losses/soft_dtw.md
      - Local similarity (Fomel 2007): losses/local_similarity.md
  - Report (formulas + bibliography): report.md
  - References: references.md
