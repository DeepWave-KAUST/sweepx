# ─────────────────────────────────────────────────────────────────────────
# sweep-tasks — documentation config  (from sweepx/docs-template)
#
# STYLE comes from the sweepx umbrella at build time: mkdocs-multirepo pulls
# this docs/ into https://sweepx.deepwave.group/ and renders it with sweepx's
# theme. This file only declares the package name + nav so the umbrella can
# import it. Do NOT add the real theme / plugins / mkdocstrings options here —
# the ecosystem look is defined ONCE, in the sweepx repo.
#
# Quick standalone check (plain Material, no sweepx skin): `mkdocs serve` here.
# Real look: preview from the sweepx repo.
# ─────────────────────────────────────────────────────────────────────────
site_name: sweep-tasks
theme:
  name: material                 # placeholder only — sweepx supplies the real theme

nav:
  - index.md
  - Getting started:
      - getting-started/installation.md
      - getting-started/quickstart.md
  - User guide:
      - user-guide/index.md
      - CLI workflow: cli_workflow.md
  - Examples:
      - examples/index.md
      - Forward modelling: examples/forward.md
      - FWI, single-scale: examples/fwi-single.md
      - FWI, multiscale: examples/fwi-multiscale.md
      - iFWI: examples/ifwi.md
      - RTM and LSRTM: examples/imaging.md
      - Wavefield snapshots: examples/wavefield.md
      - Backends and memory: examples/backends.md
      - Frequency-selection FWI, 2-D: examples/freqsel-2d.md
      - Frequency-selection FWI, 3-D: examples/freqsel-3d.md
      - Anisotropic and elastic: examples/multiparameter.md
      - Introspection: examples/introspect.md
      - Viking (field data): datasets/viking/README.md
  - API reference:
      - api/index.md
