[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweep-nn"
version = "0.1.0"
description = "PyTorch neural reparameterization and priors for seismic FWI: SIREN, DIP, learned regularizers."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Shaowen Wang", email = "shaowen.wang@kaust.edu.sa"},
]
keywords = ["fwi", "geophysics", "neural-network", "reparameterization", "dip", "siren", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=1.13",
    "numpy>=1.20",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev  = ["pytest>=7", "ruff", "black"]


[project.urls]
Homepage = "https://github.com/DeepWave-KAUST/sweep-nn"
Issues   = "https://github.com/DeepWave-KAUST/sweep-nn/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
