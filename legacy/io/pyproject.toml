[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweep-io"
version = "0.1.0"
description = "File and dataset I/O for seismic full-waveform inversion: velocity models, SEG-Y, acquisition geometry, shot-gather datasets."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Shaowen Wang"},
]
keywords = ["fwi", "geophysics", "io", "segy", "seismic"]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
segy  = ["segyio>=1.9"]
hdf5  = ["h5py>=3.6"]
torch = ["torch>=1.13"]
test  = ["pytest>=7"]
dev   = ["pytest>=7", "segyio>=1.9", "h5py>=3.6", "torch>=1.13", "ruff", "black"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
