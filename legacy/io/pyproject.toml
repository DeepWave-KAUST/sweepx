[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweep-io"
version = "0.1.0"
description = "File and dataset I/O for seismic full-waveform inversion: velocity models, SEG-Y, acquisition geometry, shot-gather datasets."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Shaowen Wang", email = "shaowen.wang@kaust.edu.sa"},
]
keywords = ["fwi", "geophysics", "io", "segy", "seismic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
segy  = ["segyio>=1.9"]
hdf5  = ["h5py>=3.6"]
torch = ["torch>=1.13"]
test  = ["pytest>=7"]
dev   = ["pytest>=7", "segyio>=1.9", "h5py>=3.6", "torch>=1.13", "ruff", "black"]


[project.urls]
Homepage = "https://github.com/DeepWave-KAUST/sweep-io"
Issues   = "https://github.com/DeepWave-KAUST/sweep-io/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
