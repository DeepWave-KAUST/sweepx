[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweep-opt"
version = "0.1.0"
description = "PyTorch optimizers tailored for Full Waveform Inversion (FWI)."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Shaowen Wang"},
]
keywords = ["fwi", "geophysics", "optimization", "seismic", "pytorch", "inverse-problem"]
dependencies = [
    "torch>=1.13",
    "numpy>=1.20",
]

[project.optional-dependencies]
test  = ["pytest>=7", "scipy>=1.8"]
dev   = ["pytest>=7", "scipy>=1.8", "ruff", "black", "mkdocs", "mkdocs-material"]
docs  = ["mkdocs", "mkdocs-material"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
