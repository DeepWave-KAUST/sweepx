site_name: sweep-opt
site_description: "PyTorch optimizers tailored for Full Waveform Inversion (FWI)."
site_author: "Shijun Wang"
repo_url: "https://github.com/DeepWave-KAUST/sweep-opt"
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting_started/installation.md
      - Quick start: getting_started/quickstart.md
      - Data convention: getting_started/data_convention.md
  - Optimizers:
      - Overview: optimizers/index.md
      - Steepest Descent: optimizers/steepest_descent.md
      - Nonlinear CG (PR+): optimizers/ncg.md
      - L-BFGS-FWI: optimizers/lbfgs.md
      - Truncated Newton (HF): optimizers/newton.md
      - Truncated Gauss-Newton: optimizers/gauss_newton.md
      - Trust-Region (TTR/ASTR): optimizers/trust_region.md
  - Preconditioners:
      - Overview: preconditioners/index.md
      - Pseudo-Hessian: preconditioners/pseudo_hessian.md
  - Parameterization:
      - Overview: parameterization/index.md
  - Marmousi report: report.md
  - References: references.md
