[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweep-agent"
version = "0.0.4"
description = "Offline-LLM natural-language control layer for the sweep stack. Routes user intent (chat / files) through a local LLM (vLLM/Ollama/llama.cpp) into validated sweep-tasks specs and executes them."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Shaowen Wang", email = "shaowen.wang@kaust.edu.sa"},
]
keywords = ["fwi", "lsrtm", "geophysics", "llm", "agent", "tool-calling", "vllm", "sweep"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
# `sweep-solver` (the core solver, imports as `sweep`) IS on PyPI, so it's a hard
# dep — this makes natural-language forward modelling / wavefields / shot gathers
# work out of the box (`run_forward_sweep` needs only the core solver). The
# production runner `sweep-tasks` (FWI/LSRTM specs, TaskRunner) is NOT on PyPI yet;
# the build_*/execute/introspect tools import it lazily and return a clean error
# when it's missing, so everything else keeps working. Install sweep-tasks from
# source for the full FWI pipeline (see README).
dependencies = [
    "sweep-solver>=0.1,<0.3",
    "pydantic>=2.0",
    "httpx>=0.25",
    "PyYAML>=6.0",
    "numpy>=1.20",
    "matplotlib>=3.5",   # the plotting tools draw here; 3 of them need nothing else
]

[project.optional-dependencies]
vllm    = ["vllm>=0.5"]
mcp     = ["mcp>=0.9"]
ui      = ["gradio>=4.0", "ipywidgets>=8.0"]
animate = ["imageio>=2.9"]   # GIF writing for animate_fwi_evolution
test = ["pytest>=7"]
dev  = ["pytest>=7", "ruff", "black"]

[project.scripts]
sweep-agent = "sweep_agent.cli:main"

[project.urls]
Homepage = "https://github.com/DeepWave-KAUST/sweep-agent"
Issues   = "https://github.com/DeepWave-KAUST/sweep-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
