# ─────────────────────────────────────────────────────────────────────────
# sweepx — the UMBRELLA docs site (https://sweepx.deepwave.group/)
#
# This is the SINGLE source of truth for the ecosystem's doc STYLE and the
# only published site. mkdocs-multirepo pulls each package's `docs/` at build
# time and renders it with the theme/config below, so every package's pages
# look identical automatically. Sub-repos carry only their `docs/` content +
# a thin nav-only mkdocs.yml (see `docs-template/`).
#
# To add a package: give it a `docs/` from `docs-template/`, then add one
# `!import` line to the `nav:` below (and `pip install` it in the build env
# so mkdocstrings can render its API).
# ─────────────────────────────────────────────────────────────────────────
site_name: SWEEPX
site_description: The sweep seismic wave-equation ecosystem — one home for solver, tasks, agent, and companions.
site_url: https://sweepx.deepwave.group/
repo_url: https://github.com/DeepWave-KAUST/sweepx
repo_name: DeepWave-KAUST/sweepx
# NB: do NOT set `edit_uri: ""` — an empty string crashes mkdocs-multirepo
# (need_to_derive_edit_uris = edit_uri is None → "" skips derivation →
# UnboundLocalError on derived_edit_uri). Leaving edit_uri unset lets the
# plugin derive per-repo values; the theme omits content.action.edit so no
# edit links render anyway.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo/sweep-icon-transparent.svg
  favicon: assets/logo/sweep-icon-32.png
  font:
    text: Inter Tight
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  generator: false
  # Repo shown top-right, per top-level section (first URL segment). Anything
  # not listed falls back to repo_url/repo_name above (the umbrella).
  section_repos:
    solver: DeepWave-KAUST/sweep
  # Top-level nav sections shown as a tab with a dropdown, grouped as listed:
  # group -> {section title: one-line note}. A section missing here is still in
  # the sidebar but not in the dropdown.
  tab_menus:
    sweepx:
      Workflows:
        Tasks: YAML task runner for FWI, LSRTM, RTM and forward runs
        Agent: plain-language control through a local LLM
      Libraries:
        IO: SEG-Y, acquisition geometry, data and model plans
        Loss: misfit functions, from L2 to optimal transport
        NN: neural reparameterizations and priors
        Opt: FWI optimizers and preconditioners
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DeepWave-KAUST

plugins:
  - search
  # Pull each package's docs/ from its own repo at build time. The nav uses
  # `!import <repo-url>` entries below; this plugin resolves them.
  - multirepo:
      cleanup: true
      # keep_docs_dir omitted → imported docs land at /<section>/… not
      # /<section>/docs/… (cleaner URLs, matches the standalone preview).
  # Render the Jupyter notebooks (the solver's examples, imported, and
  # docs/nn/examples/). Config mirrors sweep's own mkdocs.yml.
  - mkdocs-jupyter:
      # Notebooks only. The default also turns every .py under docs/ into a page:
      # docs/nn/examples/ifwi_models.py (embedded velocity models) became a
      # 2.5 MB orphan page that way. The .py files are still copied as files.
      include: ["*.ipynb"]
      include_source: true
      execute: false
      ignore_h1_titles: true
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  # API pages: options MIRROR sweep's own mkdocs.yml so every package's API
  # renders identically (separate signature block, SPECS admonitions, etc.).
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            force_inspection: true
            show_source: false
            show_root_heading: true
            docstring_style: google
            docstring_section_style: list
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            line_length: 88
            filters:
              - "!^_[^_]"
              - "!^__"
              - "!^FIELD_SPECS$"
              - "!^MODEL_SPECS$"
              - "!^default_pml_type$"
              - "!^supports_apm$"

# Top-level tabs. Home is the SWEEPX hero; each package is imported from its
# own repo. Order here = tab order.
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Solver: '!import https://github.com/DeepWave-KAUST/sweep?branch=dev&docs_dir=docs/*'
  # The toolkit: one tab with a dropdown (overrides/partials/tabs-item.html,
  # groups in extra.tab_menus). Page URLs stay /tasks/, /loss/, ...
  - sweepx:
    - sweepx/index.md
    - Tasks:
      - tasks/index.md
      - Getting started:
        - tasks/getting-started/installation.md
        - tasks/getting-started/quickstart.md
      - User guide:
        - tasks/user-guide/index.md
        - CLI workflow: tasks/cli_workflow.md
      - Examples:
        - tasks/examples/index.md
        - Forward modelling: tasks/examples/forward.md
        - FWI, single-scale: tasks/examples/fwi-single.md
        - FWI, multiscale: tasks/examples/fwi-multiscale.md
        - iFWI: tasks/examples/ifwi.md
        - RTM and LSRTM: tasks/examples/imaging.md
        - Wavefield snapshots: tasks/examples/wavefield.md
        - Backends and memory: tasks/examples/backends.md
        - Frequency-selection FWI, 2-D: tasks/examples/freqsel-2d.md
        - Frequency-selection FWI, 3-D: tasks/examples/freqsel-3d.md
        - Anisotropic and elastic: tasks/examples/multiparameter.md
        - Introspection: tasks/examples/introspect.md
        - Viking (field data): tasks/datasets/viking/README.md
      - API reference:
        - tasks/api/index.md
    - Agent:
      - agent/index.md
      - Getting started:
        - agent/getting-started/installation.md
        - agent/getting-started/quickstart.md
      - User guide:
        - agent/user-guide/index.md
      - Examples:
        - agent/examples/index.md
      - API reference:
        - agent/api/index.md
    - IO:
      - io/index.md
      - Getting started:
        - io/getting-started/installation.md
        - io/getting-started/quickstart.md
      - Examples: io/examples.md
      - API reference:
        - io/api/index.md
    - Loss:
      - Home: loss/index.md
      - Getting started:
        - Installation: loss/getting_started/installation.md
        - Quick start: loss/getting_started/quickstart.md
        - Data convention: loss/getting_started/data_convention.md
      - Loss functions:
        - Overview: loss/losses/index.md
        - L2 (least squares): loss/losses/l2.md
        - L1 (absolute): loss/losses/l1.md
        - Huber / pseudo-Huber: loss/losses/huber.md
        - Hybrid L1/L2 (Bube–Langan): loss/losses/hybrid_l1l2.md
        - Cauchy / Tukey / Geman–McClure: loss/losses/robust.md
        - Student-t NLL: loss/losses/student_t.md
        - Trace-normalised L2 / NCC: loss/losses/correlation.md
        - Cross-correlation travel-time: loss/losses/traveltime.md
        - Envelope (Bozdağ / Wu / Chi): loss/losses/envelope.md
        - Instantaneous phase + Envelope+Phase: loss/losses/inst_phase.md
        - Exponentiated phase (Yuan 2020): loss/losses/exponentiated_phase.md
        - Time-Frequency phase (Fichtner-Kristeková): loss/losses/tf_phase.md
        - Frequency / Laplace domain: loss/losses/frequency.md
        - Normalised Integration Method (NIM): loss/losses/nim.md
        - Jensen-Shannon divergence (Yan 2024): loss/losses/jsd.md
        - Adaptive Waveform Inversion (AWI): loss/losses/awi.md
        - OT of Matching Filter (Sun-Alkhalifah 2019): loss/losses/otmf.md
        - Deconvolution (Luo–Sava): loss/losses/deconvolution.md
        - 1-Wasserstein (Métivier 2016): loss/losses/w1.md
        - 2-Wasserstein (Engquist–Froese / Yang): loss/losses/w2.md
        - Sinkhorn / entropic OT: loss/losses/sinkhorn.md
        - Graph-space OT (Métivier 2018): loss/losses/gsot.md
        - Soft-DTW (Cuturi-Blondel 2017): loss/losses/soft_dtw.md
        - Local similarity (Fomel 2007): loss/losses/local_similarity.md
      - Report (formulas + bibliography): loss/report.md
      - References: loss/references.md
    - NN:
      - nn/index.md
      - Getting started:
        - nn/getting-started/installation.md
        - nn/getting-started/quickstart.md
      - Examples:
        - nn/examples/README.md
        - Pseudo-Hessian, Overthrust: nn/examples/pseudo_hessian_overthrust.ipynb
        - Hash encoding, Marmousi: nn/examples/hash_encoding_marmousi.ipynb
      - API reference:
        - nn/api/index.md
    - Opt:
      - Home: opt/index.md
      - Getting started:
        - Installation: opt/getting_started/installation.md
        - Quick start: opt/getting_started/quickstart.md
        - Data convention: opt/getting_started/data_convention.md
      - Optimizers:
        - Overview: opt/optimizers/index.md
        - Steepest Descent: opt/optimizers/steepest_descent.md
        - Nonlinear CG (PR+): opt/optimizers/ncg.md
        - L-BFGS-FWI: opt/optimizers/lbfgs.md
        - Truncated Newton (HF): opt/optimizers/newton.md
        - Truncated Gauss-Newton: opt/optimizers/gauss_newton.md
        - Trust-Region (TTR/ASTR): opt/optimizers/trust_region.md
        - L-BFGS-B: opt/optimizers/lbfgsb.md
        - Adam-FWI: opt/optimizers/adam_fwi.md
        - Lion: opt/optimizers/lion.md
        - SAM: opt/optimizers/sam.md
        - Shampoo: opt/optimizers/shampoo.md
        - SOAP: opt/optimizers/soap.md
      - Preconditioners:
        - Overview: opt/preconditioners/index.md
        - Pseudo-Hessian: opt/preconditioners/pseudo_hessian.md
        - Depth weighting: opt/preconditioners/depth_weighting.md
      - Parameterization:
        - Overview: opt/parameterization/index.md
        - Bounds (sigmoid / log / perturbation): opt/parameterization/bounds.md
        - DIP-FWI: opt/parameterization/dip.md
      - References: opt/references.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - javascripts/katex.js

