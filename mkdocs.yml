# ─────────────────────────────────────────────────────────────────────────
# sweepx — the UMBRELLA docs site (https://sweepx.deepwave.group/)
#
# This is the SINGLE source of truth for the ecosystem's doc STYLE and the
# only published site. mkdocs-multirepo pulls each package's `docs/` at build
# time and renders it with the theme/config below, so every package's pages
# look identical automatically. Sub-repos carry only their `docs/` content +
# a thin nav-only mkdocs.yml (see `docs-template/`).
#
# To add a package: give it a `docs/` from `docs-template/`, then add one
# `!import` line to the `nav:` below (and `pip install` it in the build env
# so mkdocstrings can render its API).
# ─────────────────────────────────────────────────────────────────────────
site_name: sweepx — documentation
site_description: The sweep seismic wave-equation ecosystem — one home for solver, tasks, agent, and companions.
site_url: https://sweepx.deepwave.group/
repo_url: https://github.com/DeepWave-KAUST/sweepx
repo_name: DeepWave-KAUST/sweepx
# NB: do NOT set `edit_uri: ""` — an empty string crashes mkdocs-multirepo
# (need_to_derive_edit_uris = edit_uri is None → "" skips derivation →
# UnboundLocalError on derived_edit_uri). Leaving edit_uri unset lets the
# plugin derive per-repo values; the theme omits content.action.edit so no
# edit links render anyway.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo/sweep-icon-transparent.svg
  favicon: assets/logo/sweep-icon-32.png
  font:
    text: Inter Tight
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DeepWave-KAUST

plugins:
  - search
  # Pull each package's docs/ from its own repo at build time. The nav uses
  # `!import <repo-url>` entries below; this plugin resolves them.
  - multirepo:
      cleanup: true
      # keep_docs_dir omitted → imported docs land at /<section>/… not
      # /<section>/docs/… (cleaner URLs, matches the standalone preview).
  # Render sub-repos' Jupyter notebooks (Solver's examples). Config mirrors
  # sweep's own mkdocs.yml.
  - mkdocs-jupyter:
      include_source: true
      execute: false
      ignore_h1_titles: true
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  # API pages: options MIRROR sweep's own mkdocs.yml so every package's API
  # renders identically (separate signature block, SPECS admonitions, etc.).
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            force_inspection: true
            show_source: false
            show_root_heading: true
            docstring_style: google
            docstring_section_style: list
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            line_length: 88
            filters:
              - "!^_[^_]"
              - "!^__"
              - "!^FIELD_SPECS$"
              - "!^MODEL_SPECS$"
              - "!^default_pml_type$"
              - "!^supports_apm$"

# Top-level tabs. Home is the SWEEPX hero; each package is imported from its
# own repo. Order here = tab order.
nav:
  - Home: index.md
  # Solver keeps `docs/` (keep_docs_dir) because its `docs/notebooks` is a
  # SYMLINK to `../examples/notebooks`: multirepo's mv_docs_up.sh would hoist
  # docs/* to the section root, leaving the link pointing one level outside the
  # section (build fails on all 26 notebook nav entries). Keeping docs/ + also
  # sparse-checking out examples/notebooks preserves the relative layering.
  # Cost: Solver pages live at /solver/docs/… (Tasks/Agent stay at /tasks/…).
  - Solver: '!import https://github.com/DeepWave-KAUST/sweep?branch=dev&docs_dir=docs/*&extra_imports=["examples/notebooks/*"]&keep_docs_dir=true'
  - Tasks: '!import https://github.com/DeepWave-KAUST/sweep-tasks?branch=main&docs_dir=docs/*'
  - Agent: '!import https://github.com/DeepWave-KAUST/sweep-agent?branch=main&docs_dir=docs/*'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - javascripts/katex.js
